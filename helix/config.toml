theme = "catppuccin_mocha"

[editor]
bufferline = "multiple"
color-modes = true

[editor.indent-guides]
render = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[keys.normal.g]
j = "goto_next_change"
k = "goto_prev_change"

[keys.normal.space]
Y = ":pipe-to pbcopy"
P = ":sh printf '%%s' '%{buffer_name}' | pbcopy"
f = "file_picker_in_current_directory"
F = "no_op"

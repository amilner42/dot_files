# Use backtick (`) as the prefix instead of Ctrl-b.
# Press ` twice to send a literal backtick to the shell.
unbind C-b
set -g prefix '`'
bind '`' send-prefix

# Enable mouse — scroll wheel scrolls the pane buffer, click selects panes.
set -g mouse on

# h/l navigate windows (left/right), j/k navigate panes (down/up).
# Only horizontal windows are used, so h/l are repurposed from pane to window navigation.
bind h previous-window
bind l next-window
bind j select-pane -L
bind k select-pane -R

# Pane borders - the active pane needs to be unmissable, especially when
# Helix or other TUIs paint over the pane and we can't dim contents directly.
# Strategy: heavy border lines, solid orange bar on the active border
# (bg+fg both orange = filled bar, not just colored characters), inactive
# borders nearly invisible (#1a1a1a) so they recede.
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#1a1a1a'
set -g pane-active-border-style '#{?window_zoomed_flag,fg=#1e90ff bg=#1e90ff bold,fg=#ff8c00 bg=#ff8c00 bold}'
# Top border shows "◆ ACTIVE ◆" for the focused pane, "index: command" for others.
set -g pane-border-format '#{?pane_active,#{?window_zoomed_flag,#[bg=#1e90ff#,fg=black#,bold]  ◆ ZOOMED ◆  #[default],#[bg=#ff8c00#,fg=black#,bold]  ◆ ACTIVE ◆  #[default]}, #{pane_index}: #{pane_current_command} }'
set -g pane-border-status top

# Status bar - dark bg so window text is readable. tmux's default status-style
# is bg=green,fg=black, which makes any custom fg colors look washed out.
set -g status-style 'bg=#1a1a1a,fg=#aaaaaa'
set -g window-status-current-style 'fg=#ff8c00,bold'
set -g window-status-style 'fg=#aaaaaa'
# Drop the trailing "*" on the active window — color/bold already makes it obvious.
set -g window-status-current-format '#I:#W#{?window_zoomed_flag, [Z],}'

# Close gaps automatically when a window is killed
set -g renumber-windows on

# Shift the current window left/right. -r repeats so you can hold prefix and tap.
# -d keeps focus on the moved window instead of following it.
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1
